backend:
  name: git-gateway
  branch: main

locale: fr

media_folder: assets/images/uploads
public_folder: /assets/images/uploads

editor:
  preview: false

collections:
  - name: evenements
    label: Evenements
    label_singular: Evenement
    folder: content/evenements
    create: true
    delete: true
    extension: yml
    format: yaml
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} - {{city}} - {{start_date}}"
    fields:
      - label: Nom de l evenement
        name: title
        widget: string
      - label: Date de debut
        name: start_date
        widget: date
        format: YYYY-MM-DD
      - label: Date de fin
        name: end_date
        widget: date
        format: YYYY-MM-DD
      - label: Ville
        name: city
        widget: string
      - label: Lieu
        name: place
        widget: string
        required: false
      - label: Categorie
        name: category
        widget: select
        options:
          - festival
          - marche
          - marche de Noel
          - food festival
          - evenement prive
          - fete communale
          - autre
      - label: Saison
        name: season
        widget: select
        options:
          - printemps
          - ete
          - automne
          - hiver
          - annuel
      - label: Description
        name: description
        widget: text
      - label: Texte du lien
        name: link_label
        widget: string
        required: false
      - label: URL du lien
        name: link_url
        widget: string
        required: false
      - label: Photo
        name: image
        widget: image
        required: false
      - label: Visible sur le site
        name: visible
        widget: boolean
        default: true
      - label: Mis en avant
        name: featured
        widget: boolean
        default: false
      - label: Ordre d affichage
        name: order
        widget: number
        default: 99

  - name: saveurs
    label: Saveurs
    label_singular: Saveur
    folder: content/saveurs
    create: true
    delete: true
    extension: yml
    format: yaml
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} - {{category}}"
    fields:
      - label: Nom de la saveur
        name: title
        widget: string
      - label: Categorie
        name: category
        widget: select
        options:
          - sucre
          - tartinage
          - signature
          - sale
          - saisonnier
          - a venir
      - label: Description courte
        name: description
        widget: text
      - label: Badge
        name: badge
        widget: select
        options:
          - classique
          - signature
          - gourmand
          - saisonnier
          - sale
          - reconfortant
      - label: Saveur permanente
        name: permanent
        widget: boolean
        default: true
      - label: Prochainement
        name: upcoming
        widget: boolean
        default: false
      - label: Visible sur le site
        name: visible
        widget: boolean
        default: true
      - label: Photo
        name: image
        widget: image
        required: false
      - label: Ordre d affichage
        name: order
        widget: number
        default: 99

  - name: galerie
    label: Galerie photos
    label_singular: Photo
    folder: content/galerie
    create: true
    delete: true
    extension: yml
    format: yaml
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} - {{category}}"
    fields:
      - label: Titre
        name: title
        widget: string
      - label: Photo
        name: image
        widget: image
      - label: Texte alternatif SEO
        name: alt
        widget: string
      - label: Legende affichee
        name: caption
        widget: string
        required: false
      - label: Categorie
        name: category
        widget: select
        options:
          - cuisson
          - saveurs
          - stand
          - evenements
          - ete
          - hiver
          - Montreux Jazz
          - Montreux Noel
          - autres
      - label: Visible sur le site
        name: visible
        widget: boolean
        default: true
      - label: Photo mise en avant
        name: featured
        widget: boolean
        default: false
      - label: Ordre d affichage
        name: order
        widget: number
        default: 99
      - label: Date de la photo
        name: date
        widget: date
        format: YYYY-MM-DD
        required: false

  - name: settings
    label: Reglages du site
    files:
      - label: Reglages generaux
        name: site
        file: content/settings/site.yml
        format: yaml
        fields:
          - label: Email de contact
            name: email
            widget: string
          - label: URL Instagram
            name: instagram_url
            widget: string
          - label: URL Facebook
            name: facebook_url
            widget: string
          - label: URL TikTok
            name: tiktok_url
            widget: string
            required: false
          - label: Theme actif
            name: active_theme
            widget: select
            default: summer
            options:
              - summer
              - winter
          - label: Texte du bouton principal
            name: main_cta_label
            widget: string
            default: Decouvrir nos kurtos artisanaux
          - label: Texte du bouton de contact
            name: contact_cta_label
            widget: string
            default: Inviter Zia Kurtos
          - label: Texte annonce
            name: announcement_text
            widget: string
            required: false
          - label: Mention du createur du site
            name: footer_credit_text
            widget: string
            default: Site cree par Web On It
          - label: Lien du createur
            name: footer_credit_url
            widget: string
            default: https://www.instagram.com/web.onit/
